[package]
name = "codex-theme-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Asset-based UI theme engine for the Codex desktop app: loopback CDP injection, zero modification of app files. Rust port of codex-theme-studio's core."

[dependencies]
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-tungstenite = "0.30"
url.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile = "3"
