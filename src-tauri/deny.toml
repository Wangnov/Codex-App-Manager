# Blocking cargo-deny policy for the four platforms this project publishes.
# Linux-only Tauri/GTK dependencies in the shared lockfile are intentionally
# outside this graph because this repository does not ship Linux artifacts.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Unmaintained rust-unic dependency is transitive via Tauri urlpattern; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0080", reason = "Unmaintained rust-unic dependency is transitive via Tauri urlpattern; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0081", reason = "Unmaintained rust-unic dependency is transitive via Tauri urlpattern; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0098", reason = "Unmaintained rust-unic dependency is transitive via Tauri urlpattern; no safe upgrade is available." },
  { id = "RUSTSEC-2025-0100", reason = "Unmaintained rust-unic dependency is transitive via Tauri urlpattern; no safe upgrade is available." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
