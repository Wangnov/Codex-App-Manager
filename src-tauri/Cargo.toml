[package]
name = "codex-app-manager"
# The GUI app is the only [[bin]]. Dev/test harnesses live in examples/ (e.g.
# examples/win_real_smoke.rs) so cargo and tauri never build or bundle them into
# the .app — tauri's bundler copies every bin target, so a harness under src/bin/
# would otherwise ride along in the production app. default-run is kept
# defensively to pin `cargo run` to the app should another src/bin/* be added.
default-run = "codex-app-manager"
version = "0.5.14"
description = "A cross-platform manager for installing and updating mirrored official Codex desktop app packages."
authors = ["Wangnov"]
edition.workspace = true
license.workspace = true
repository = "https://github.com/Wangnov/Codex-App-Manager"

[lib]
name = "codex_app_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64.workspace = true
codex-mac-engine = { path = "../crates/codex-mac-engine" }
codex-theme-engine = { path = "../crates/codex-theme-engine" }
codex-win-engine = { path = "../crates/codex-win-engine" }
directories = "6.0.0"
fs4 = "1.1"
log.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["socks", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true
uuid.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip.workspace = true

[dev-dependencies]
# Only for the loopback reqwest-error classification test: reqwest is built
# without a bundled TLS provider, and the updater plugin installs the ring one
# at runtime before its first client.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Keep these pinned to Tauri/Wry's WebView2 ABI: the platform handle returned
# by `WebviewWindow::with_webview` exposes these exact COM interfaces.
webview2-com = "=0.39.1"
windows-core = "0.100.0"
