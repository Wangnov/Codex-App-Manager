name: Windows installer check

# Builds the NSIS installer (the only place the custom template + branding +
# languages are exercised — the PR `ci.yml` matrix runs clippy/tests but never
# bundles), then runs a packaged lifecycle smoke on Windows x64:
# install → first launch → upgrade → uninstall.
#
# Also probes Authenticode on the installer and installed PE files in
# non-blocking (optional) mode until a real provider is configured, and proves
# the signCommand plumbing itself with a throwaway self-signed certificate (no
# real secrets involved — see docs/windows-signing.md).
#
# ARM64 is NOT smoke-tested here: GitHub-hosted runners are x64, and a
# cross-built ARM64 PE is not runtime verification. See docs/windows-signing.md.
#
# CI shell is already `pwsh` — invoke helper scripts in-process with
# `& .\scripts\...ps1` (nested `pwsh -File ... -Path @(…)` breaks array binding).

on:
  pull_request:
    paths:
      - "src-tauri/installer/**"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/src/**"
      - "crates/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/windows-*.ps1"
      - "scripts/sign-windows-authenticode.ps1"
      - "scripts/verify-windows-authenticode.ps1"
      - "scripts/resolve-esigner-cka-installer.ps1"
      - ".github/workflows/win-installer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-installer-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esigner-archive-check:
    name: eSigner CKA archive extraction check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Secret-free dry run on every PR that touches this script or its pin:
      # downloads the real, publicly pinned SSL.com eSigner CKA release
      # archive, verifies its SHA-256, and asserts the extraction/rename
      # logic still resolves the shipped, build-stamped executable (e.g.
      # "SSL.COM eSigner CKA_1.0.6_build_20230829.exe") to the fixed
      # `eSigner_CKA_Installer.exe` path that release.yml's credentialed
      # "Provision eSigner CKA certificate" step depends on. No installer is
      # ever executed here. This is what would have caught (and now
      # prevents a regression of) the archive-layout mismatch described in
      # scripts/resolve-esigner-cka-installer.ps1's header comment: a future
      # SSL.com release that changes the archive layout, or a bad pin bump,
      # fails here instead of on the first real release attempt.
      - name: Resolve + assert eSigner CKA installer path
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "esigner-archive-check"
          $installer = & ./scripts/resolve-esigner-cka-installer.ps1 -DestinationDir $dest -Stage "esigner-archive-check"
          $expected = Join-Path $dest "eSigner_CKA_Installer.exe"
          if ($installer -ne $expected) {
            Write-Host "::error::[esigner-archive-check] resolved path '$installer' does not match expected '$expected'"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-Host "::error::[esigner-archive-check] resolved installer '$installer' does not exist on disk"
            exit 1
          }
          Write-Host "[esigner-archive-check] OK: $installer"

  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # NSIS only — just needs to compile the template, resolve the brand images,
      # and link all languages. NO signing secrets here on purpose: this is a
      # pull_request trigger running PR-authored code (config/template/hooks), so
      # exposing TAURI_SIGNING_PRIVATE_KEY / a real signing provider's credentials
      # would let a PR exfiltrate keys. createUpdaterArtifacts is off.
      # vars.WINDOWS_SIGNING_PROVIDER is never set on this PR trigger, so Tauri's
      # bundle.windows.signCommand hook (scripts/sign-windows-authenticode.ps1)
      # runs its unsigned no-op branch here — the throwaway self-signed proof
      # below exercises the real signing path separately and safely, without
      # a real certificate.
      - name: Build NSIS installer
        id: build
        shell: bash
        run: |
          echo "::group::[build] tauri nsis x86_64"
          npm run tauri build -- --bundles nsis --target x86_64-pc-windows-msvc
          echo "::endgroup::"

      - name: Locate installer + PE arch diagnostic
        id: artifact
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $setup = Get-ChildItem -Path $nsis -Filter "*-setup.exe" -ErrorAction Stop |
            Select-Object -First 1
          if (-not $setup) {
            Write-Host "::error::[build] no *-setup.exe under $nsis"
            exit 1
          }
          $main = "src-tauri/target/x86_64-pc-windows-msvc/release/codex-app-manager.exe"
          if (-not (Test-Path -LiteralPath $main)) {
            Write-Host "::error::[build] missing main PE: $main"
            exit 1
          }
          Write-Host "INSTALLER=$($setup.FullName)"
          "installer=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # In-process invoke — do not nest `pwsh -File` (array -Path binding breaks).
          # Hard-assert the app PE only; NSIS -setup.exe is a host stub and may
          # not match the payload architecture.
          & .\scripts\windows-pe-arch.ps1 -Path $main -ExpectMachine 0x8664
          & .\scripts\windows-pe-arch.ps1 -Path $setup.FullName

      # ── Prove the signCommand plumbing end-to-end without a real certificate ─
      #    Creates a throwaway self-signed code-signing cert, runs the SAME
      #    script Tauri's bundle.windows.signCommand calls
      #    (scripts/sign-windows-authenticode.ps1) in local-pfx mode against
      #    COPIES of the built main exe + installer, then asserts every copy
      #    carries a signature whose SignerCertificate.Thumbprint matches the
      #    throwaway cert. A self-signed cert never chains to a trusted root,
      #    so Status is expected to be non-Valid here — this step proves the
      #    dispatch/signing path works, not trust (that's what
      #    verify-windows-authenticode.ps1 in required mode is for, once a
      #    real provider is configured). Runs on copies so the real installer
      #    used by the smoke test below stays untouched.
      - name: Authenticode signCommand proof (throwaway self-signed cert)
        shell: pwsh
        run: |
          Write-Host "::group::[proof] create throwaway self-signed code-signing certificate"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Codex App Manager CI Signing Proof" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -NotAfter (Get-Date).AddDays(1)
          $thumbprint = $cert.Thumbprint
          Write-Host "Created throwaway cert thumbprint=$thumbprint"

          $proofDir = Join-Path $env:RUNNER_TEMP "signcommand-proof"
          New-Item -ItemType Directory -Force -Path $proofDir | Out-Null
          $pfxPath = Join-Path $proofDir "proof.pfx"
          $pfxPassword = [guid]::NewGuid().ToString("n")
          $securePass = ConvertTo-SecureString -String $pfxPassword -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePass | Out-Null
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          $pfxBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxPath))
          Write-Host "::endgroup::"

          $mainSrc = "src-tauri/target/x86_64-pc-windows-msvc/release/codex-app-manager.exe"
          $setupSrc = "${{ steps.artifact.outputs.installer }}"
          $mainProof = Join-Path $proofDir "codex-app-manager.exe"
          $setupProof = Join-Path $proofDir (Split-Path -Leaf $setupSrc)
          Copy-Item -LiteralPath $mainSrc -Destination $mainProof -Force
          Copy-Item -LiteralPath $setupSrc -Destination $setupProof -Force

          $env:WINDOWS_SIGNING_PROVIDER = "local-pfx"
          $env:WINDOWS_CERTIFICATE = $pfxBase64
          $env:WINDOWS_CERTIFICATE_PASSWORD = $pfxPassword
          try {
            & .\scripts\sign-windows-authenticode.ps1 -Path @($mainProof, $setupProof) -Stage "sign-proof"
          }
          finally {
            Remove-Item Env:\WINDOWS_CERTIFICATE, Env:\WINDOWS_CERTIFICATE_PASSWORD, Env:\WINDOWS_SIGNING_PROVIDER -ErrorAction SilentlyContinue
          }

          Write-Host "::group::[proof] assert every binary carries the throwaway certificate's signature"
          $failed = $false
          foreach ($path in @($mainProof, $setupProof)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if (-not $sig.SignerCertificate) {
              Write-Host "::error::[proof] $path has no signer certificate"
              $failed = $true
              continue
            }
            if ($sig.SignerCertificate.Thumbprint -ne $thumbprint) {
              Write-Host "::error::[proof] $path signer thumbprint $($sig.SignerCertificate.Thumbprint) does not match throwaway cert $thumbprint"
              $failed = $true
              continue
            }
            # Do NOT assert Status -eq Valid: a throwaway self-signed cert never
            # chains to a trusted root, so Status here is expected to be
            # UnknownError/NotTrusted even on a fully successful sign.
            Write-Host "[proof] OK: $(Split-Path -Leaf $path) status=$($sig.Status) thumbprint=$($sig.SignerCertificate.Thumbprint)"
          }
          Write-Host "::endgroup::"
          Remove-Item -LiteralPath $proofDir -Recurse -Force -ErrorAction SilentlyContinue
          if ($failed) {
            Write-Host "::error::[proof] Authenticode signCommand proof failed"
            exit 1
          }

      - name: Authenticode probe (optional / non-blocking)
        shell: pwsh
        env:
          # Flip to "required" via repo variable once OV/EV is wired into release.
          AUTHENTICODE_MODE: ${{ vars.AUTHENTICODE_REQUIRED == 'true' && 'required' || 'optional' }}
        run: |
          & .\scripts\verify-windows-authenticode.ps1 `
            -Path "${{ steps.artifact.outputs.installer }}" `
            -Mode $env:AUTHENTICODE_MODE `
            -Stage "sign-verify"

      - name: Packaged lifecycle smoke (install / launch / upgrade / uninstall)
        shell: pwsh
        env:
          AUTHENTICODE_MODE: ${{ vars.AUTHENTICODE_REQUIRED == 'true' && 'required' || 'optional' }}
        run: |
          & .\scripts\windows-packaged-smoke.ps1 `
            -Installer "${{ steps.artifact.outputs.installer }}" `
            -AuthenticodeMode $env:AUTHENTICODE_MODE

      # Upload even when smoke fails so the built installer can be inspected.
      # Still requires the build/locate steps to have produced a setup.exe.
      - name: Upload installer
        if: ${{ always() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nsis-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
